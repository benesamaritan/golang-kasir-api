version: "0.5"
processes:
  kasir:
    # Build the Go application before running it
    command: sh -c "go build . && ./kasir-api"
    working_dir: .
    environment:
      # These variables are expected to be set in the devbox environment or .env
      - PORT=${PORT:-8000}
      - DB_CONN=${DB_CONN}
      - API_KEY=${API_KEY}
