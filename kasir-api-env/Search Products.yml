info:
  name: Search Products
  type: http
  seq: 5

http:
  method: GET
  url: "{{url}}/api/product?name=es&active=true"
  headers:
    - name: X-API-Key
      value: secret
  params:
    - name: name
      value: es
      type: query
    - name: active
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
