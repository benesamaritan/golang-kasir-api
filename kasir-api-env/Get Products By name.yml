info:
  name: Get Products By name
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/api/produk?name=es"
  headers:
    - name: X-API-Key
      value: secret
  params:
    - name: name
      value: es
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
