opencollection: 1.0.0

info:
  name: kasir-api-env
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: X-API-Key
      value: secret
bundled: false
extensions:
  ignore:
    - node_modules
    - .git
